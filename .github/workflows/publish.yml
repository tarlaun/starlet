name: Publish to PyPI

# Release pipeline. A `vX.Y.Z` tag push runs everything and publishes;
# `workflow_dispatch` runs the same jobs without publishing, so a change to
# the build (e.g. the Rust extension) can be checked on every platform first.
#
# The wheel carries the Rust acceleration core (starlet.starlet_core, built
# from rust/starlet-core by setuptools-rust) as an abi3 extension, so there
# is one wheel per platform for every CPython >= 3.10, plus an sdist that
# compiles the core when a Rust toolchain is present and otherwise installs
# the pure-Python engine.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/starlet-core

      - name: Install dependencies (builds the Rust core)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov pytest-mock
          python -c "import starlet.starlet_core as c; print('starlet_core', c.__version__, c.num_threads(), 'threads')"

      - name: Run tests
        run: |
          pytest tests/ -v --cov=starlet --cov-report=term

      - name: Rust unit tests
        working-directory: rust/starlet-core
        run: cargo test --release

  wheels:
    name: Wheel ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,  os: ubuntu-latest,    arch: x86_64 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, arch: aarch64 }
          - { name: macos-x86_64,  os: macos-13,         arch: x86_64 }
          - { name: macos-arm64,   os: macos-14,         arch: arm64 }
          - { name: windows-x64,   os: windows-latest,   arch: AMD64 }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # macOS / Windows build on the runner itself; Linux builds inside the
      # manylinux container, which installs Rust in cibuildwheel's before-all.
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'

      - name: Rewrite README links to absolute for PyPI
        shell: bash
        run: python scripts/render_pypi_readme.py README.md

      - name: Build and test wheel
        uses: pypa/cibuildwheel@v4.3.5
        with:
          output-dir: dist
        env:
          CIBW_ARCHS: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheel-${{ matrix.name }}
          path: dist/*.whl

  sdist:
    name: Build sdist
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build

      - name: Rewrite README links to absolute for PyPI
        # The committed README uses relative links (nice on GitHub); PyPI can't
        # resolve those, so rewrite them to absolute master URLs before building.
        run: python scripts/render_pypi_readme.py README.md

      - name: Build sdist
        run: python -m build --sdist

      - name: sdist installs without a Rust toolchain (pure-Python fallback)
        run: |
          python -m venv /tmp/nocargo
          env -i HOME=/tmp PATH=/tmp/nocargo/bin:/usr/bin:/bin /tmp/nocargo/bin/pip install --quiet dist/*.tar.gz
          env -i HOME=/tmp PATH=/tmp/nocargo/bin:/usr/bin:/bin /tmp/nocargo/bin/python -c "
          import starlet
          from starlet._internal.mvt import rust_engine
          print('starlet', starlet.__version__, 'rust available:', rust_engine.available())
          assert not rust_engine.available()
          "

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  benchmark:
    name: Run Performance Benchmarks
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install starlet
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Download benchmark dataset
        run: |
          mkdir -p benchmark_data
          curl -L -o benchmark_data/asia_postal_codes.parquet \
            https://github.com/rohanbennur43/starlet/releases/download/datasets-v1.0/asia_postal_codes.parquet
          ls -lh benchmark_data/

      - name: Run Parquet Benchmark
        id: bench_parquet
        run: |
          echo "::group::Parquet Benchmark"
          python .github/scripts/run_benchmark.py parquet
          echo "::endgroup::"

      - name: Create Summary
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > summary.py << 'SCRIPT'
          import json
          import os
          from pathlib import Path
          from datetime import datetime

          result = json.loads(Path('benchmark_parquet.json').read_text())
          release_tag = os.environ.get('RELEASE_TAG', result['version'])

          combined = {
              'version': result['version'],
              'date': datetime.now().isoformat(),
              'benchmarks': [result]
          }

          filename = f"benchmark-{release_tag}.json"
          Path(filename).write_text(json.dumps(combined, indent=2))

          md = f"""# Performance Benchmark - {release_tag}

          **Dataset:** asia_postal_codes (184K features, 1GB)
          **Date:** {combined['date'].split('T')[0]}

          ## Results

          | Metric | Value |
          |--------|-------|
          | Total Time | {result['results']['total_time_s']}s |
          | Parquet Tiles | {result['results']['parquet_tiles']} |
          | Total Rows | {result['results']['total_rows']:,} |
          | MVT Tiles | {result['results']['mvt_tiles']} |
          | Zoom Levels | {result['results']['zoom_levels']} |

          ## Configuration
          - partition_size: 100MB
          - zoom: 5
          - threshold: 50,000
          """

          Path('benchmark_summary.md').write_text(md)
          print(md)
          SCRIPT
          python summary.py

      - name: Create release with benchmark results
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if release exists
          if ! gh release view ${{ github.ref_name }} > /dev/null 2>&1; then
            # Read the benchmark summary
            NOTES=$(cat benchmark_summary.md)

            if [[ "${{ github.ref_name }}" == *"-test"* ]]; then
              gh release create ${{ github.ref_name }} \
                --title "Test Release ${{ github.ref_name }}" \
                --notes "$NOTES" \
                --prerelease
            else
              gh release create ${{ github.ref_name }} \
                --title "Release ${{ github.ref_name }}" \
                --notes "$NOTES" \
                --latest
            fi
          else
            # Update existing release with benchmark notes
            NOTES=$(cat benchmark_summary.md)
            gh release edit ${{ github.ref_name }} --notes "$NOTES"
          fi

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - name: List distributions
        run: ls -l dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
