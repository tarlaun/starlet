[project]
name = "starlet"
version = "0.5.1"
description = "Spatial tiling, MVT generation, and tile serving for geospatial data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pyarrow>=15",
    "pandas>=2",
    "numpy>=1.24",
    "shapely>=2.0",
    "click>=8",
    "ijson>=3.3",
    "mapbox-vector-tile>=2",
    "pyproj>=3",
    "flask>=3",
    "flask-cors",
    "geopandas>=0.14",
    "pyogrio>=0.8",
    "gunicorn",
    "datasketch",
    "pmtiles>=3.7",
    'tomli>=1.2.2; python_version < "3.11"',
]

[project.urls]
Homepage = "https://github.com/ucr-bdlab/starlet"
Repository = "https://github.com/ucr-bdlab/starlet"
Documentation = "https://github.com/ucr-bdlab/starlet/blob/master/README.md"
Issues = "https://github.com/ucr-bdlab/starlet/issues"

[project.scripts]
starlet = "starlet._cli:main"

[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-rust>=1.9"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["starlet*"]

[tool.setuptools.package-data]
"starlet._internal.server" = ["templates/*.html", "*.html"]

# The Rust acceleration core (rust/starlet-core) is compiled into the wheel as
# starlet.starlet_core. It is an abi3 extension (one wheel per platform serves
# every CPython >= 3.10) and *optional*: when no Rust toolchain is available
# (installing from the sdist on a platform without a prebuilt wheel) the build
# continues and starlet runs its pure-Python engine.
[[tool.setuptools-rust.ext-modules]]
target = "starlet.starlet_core"
path = "rust/starlet-core/Cargo.toml"
binding = "PyO3"
features = ["extension-module"]
py-limited-api = "cp310"
optional = true

[tool.distutils.bdist_wheel]
py-limited-api = "cp310"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
]

# Platform wheels (publish.yml). abi3 => build with one interpreter per
# platform; the result is tagged cp310-abi3-<platform>.
[tool.cibuildwheel]
build = "cp310-*"
skip = ["*-musllinux*"]
build-verbosity = 1
test-requires = ["pytest", "pytest-cov", "pytest-mock"]
test-command = [
    "python -c \"import starlet, starlet.starlet_core as c; print(starlet.__version__, 'starlet_core', c.__version__, c.num_threads(), 'threads')\"",
    "pytest {project}/tests/test_mvt/test_rust_engine.py {project}/tests/test_mvt/test_size_mode.py -q --no-cov -p no:cacheprovider --import-mode=importlib",
    "python {project}/.github/scripts/smoke_rust_size_mode.py",
]

[tool.cibuildwheel.linux]
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
# Each architecture is built natively on its own runner (see publish.yml).
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
