[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "starlet-core"
version = "0.1.0"
description = "Rust acceleration core for starlet (optional): on-the-fly vector tiles and parallel pyramid generation"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
features = ["extension-module"]
module-name = "starlet_core"
